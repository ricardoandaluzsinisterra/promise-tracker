apiVersion: apps/v1
kind: Deployment
metadata:
  name: politicians-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: politicians-service
  template:
    metadata:
      labels:
        app: politicians-service
        version: v1
    spec:
      containers:
        - name: politicians-service
          image: politicians-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
