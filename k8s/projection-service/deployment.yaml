apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projection-service
  template:
    metadata:
      labels:
        app: projection-service
        version: v1
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z postgres-projection 5432; do echo "waiting for postgres-projection"; sleep 2; done
              until nc -z kafka 9092; do echo "waiting for kafka"; sleep 2; done
      containers:
        - name: projection-service
          image: projection-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
