apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
    spec:
      initContainers:
        - name: wait-for-backends
          image: busybox
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z promises-service 80; do echo "waiting for promises-service"; sleep 2; done
              until nc -z politicians-service 80; do echo "waiting for politicians-service"; sleep 2; done
              until nc -z trackers-service 80; do echo "waiting for trackers-service"; sleep 2; done
              until nc -z sources-service 80; do echo "waiting for sources-service"; sleep 2; done
              until nc -z projection-service 80; do echo "waiting for projection-service"; sleep 2; done
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: PROMISES_SERVICE_URL
              value: "http://promises-service:80"
            - name: POLITICIANS_SERVICE_URL
              value: "http://politicians-service:80"
            - name: TRACKERS_SERVICE_URL
              value: "http://trackers-service:80"
            - name: SOURCES_SERVICE_URL
              value: "http://sources-service:80"
            - name: PROJECTION_SERVICE_URL
              value: "http://projection-service:80"
